name: Deploy

# Reusable workflow: builds, packs and publishes a single project to nuget.org.
# The nuget.org Trusted Publishing policy validates the OIDC job_workflow_ref claim,
# which points at this file, so the policy's "Workflow File" must be Deploy.yml.
on:
  workflow_call:
    inputs:
      project:
        description: 'Path to the .csproj to build and publish, relative to the repository root.'
        required: true
        type: string
      install-maui:
        description: 'Install the MAUI workload before building.'
        required: false
        default: true
        type: boolean
      SemVer:
        required: true
        type: string
      AssemblySemVer:
        required: true
        type: string
      InformationalVersion:
        required: true
        type: string
      NuGetVersion:
        required: true
        type: string
    secrets:
      NUGET_ORG_USER_NAME:
        description: 'nuget.org username (profile name), NOT the email address.'
        required: true

jobs:
  deploy:
    runs-on: windows-latest
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-tags: 'true'
        fetch-depth: 0

    - name: Display version
      run: |
        echo Project: ${{ inputs.project }}
        echo SemVer: ${{ inputs.SemVer }}
        echo AssemblySemVer: ${{ inputs.AssemblySemVer }}
        echo InformationalVersion: ${{ inputs.InformationalVersion }}
        echo NuGetVersion: ${{ inputs.NuGetVersion }}

    - name: Install .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install MAUI
      if: inputs.install-maui
      run: dotnet workload install maui --source https://api.nuget.org/v3/index.json

    - name: Build
      run: dotnet build ${{ github.workspace }}/${{ inputs.project }} --configuration Release /p:Version=${{ inputs.SemVer }} /p:AssemblyVersion=${{ inputs.AssemblySemVer }} /p:InformationalVersion=${{ inputs.InformationalVersion }}

    - name: Pack
      run: dotnet pack ${{ github.workspace }}/${{ inputs.project }} --configuration Release --no-build --output packages /p:PackageVersion=${{ inputs.NuGetVersion }}

    # Get a short-lived NuGet API key
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_ORG_USER_NAME }} # Your nuget.org username (profile name), NOT your email address

    - name: Push
      run: dotnet nuget push "packages\*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{steps.login.outputs.NUGET_API_KEY}}
