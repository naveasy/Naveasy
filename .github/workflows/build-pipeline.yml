name: Build
on:
  push:
    branches: [ "**" ]

jobs:
  git-version:
    runs-on: windows-latest
    outputs:
      SemVer: ${{ steps.gitversion.outputs.semVer }}
      AssemblySemVer: ${{ steps.gitversion.outputs.AssemblySemVer }}
      InformationalVersion: ${{ steps.gitversion.outputs.InformationalVersion }}
      NuGetVersion: ${{ steps.gitversion.outputs.NuGetVersion }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-tags: 'true'
        fetch-depth: 0
        
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v1.1.1
      with:
        versionSpec: '5.x'
        preferLatestVersion: true

    - name: GitVersion Execute
      id: gitversion
      uses: gittools/actions/gitversion/execute@v1.1.1
      with:
        useConfigFile: true
        configFilePath: 'GitVersion.yml'

  build-abstractions:
    needs: git-version
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
    uses: ./.github/workflows/Deploy.yml
    secrets: inherit
    with:
      project: Naveasy.Abstractions/Naveasy.Abstractions.csproj
      SemVer: ${{ needs.git-version.outputs.SemVer }}
      AssemblySemVer: ${{ needs.git-version.outputs.AssemblySemVer }}
      InformationalVersion: ${{ needs.git-version.outputs.InformationalVersion }}
      NuGetVersion: ${{ needs.git-version.outputs.NuGetVersion }}

  build-maui:
    needs: [git-version, build-abstractions]
    permissions:
      id-token: write
    uses: ./.github/workflows/Deploy.yml
    secrets: inherit
    with:
      project: Naveasy/Naveasy.csproj
      SemVer: ${{ needs.git-version.outputs.SemVer }}
      AssemblySemVer: ${{ needs.git-version.outputs.AssemblySemVer }}
      InformationalVersion: ${{ needs.git-version.outputs.InformationalVersion }}
      NuGetVersion: ${{ needs.git-version.outputs.NuGetVersion }}

  build-shell:
    needs: [git-version, build-abstractions]
    permissions:
      id-token: write
    uses: ./.github/workflows/Deploy.yml
    secrets: inherit
    with:
      project: Naveasy.Shell/Naveasy.Shell.csproj
      SemVer: ${{ needs.git-version.outputs.SemVer }}
      AssemblySemVer: ${{ needs.git-version.outputs.AssemblySemVer }}
      InformationalVersion: ${{ needs.git-version.outputs.InformationalVersion }}
      NuGetVersion: ${{ needs.git-version.outputs.NuGetVersion }}

  build-wpf:
    needs: git-version
    permissions:
      id-token: write
    uses: ./.github/workflows/Deploy.yml
    secrets: inherit
    with:
      project: Naveasy.WPF/Naveasy.WPF.csproj
      install-maui: false
      SemVer: ${{ needs.git-version.outputs.SemVer }}
      AssemblySemVer: ${{ needs.git-version.outputs.AssemblySemVer }}
      InformationalVersion: ${{ needs.git-version.outputs.InformationalVersion }}
      NuGetVersion: ${{ needs.git-version.outputs.NuGetVersion }}
